server {
    listen 80;
    root /srv/www;
    index index.html;
    autoindex off;
    charset utf-8;

    gzip on;
    gzip_vary on;
    gzip_types text/html text/css text/plain application/javascript application/json;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ =404;
    }

    # Fonts: long cache, immutable
    location ~* \.(woff2|woff|ttf)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Images: moderate cache
    location ~* \.(jpg|jpeg|png|gif|webp|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # HTML/CSS: short cache so rebuilt content is picked up promptly
    location ~* \.(html|css)$ {
        add_header Cache-Control "public, max-age=300";
    }
}

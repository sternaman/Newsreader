services:
  news_sync:
    build:
      context: ../..
      dockerfile: scripts/news_sync_docker/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - CONFIG_PATH=/config/news_sources.json
      - OUT_DIR=/data/news_out
      - REFRESH_SECONDS=3600
      - PORT=8080
      - QTWEBENGINE_DISABLE_SANDBOX=1
      - TZ=America/Chicago
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./config:/config:ro
    restart: unless-stopped

  news_web:
    image: nginx:alpine
    ports:
      - "8082:80"
    volumes:
      - ./data/news_out:/srv/www:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - news_sync
    restart: unless-stopped

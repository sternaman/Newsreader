services:
  news_sync:
    build:
      context: ../..
      dockerfile: scripts/news_sync_docker/Dockerfile
    ports:
      - "8081:8080"
    environment:
      - CONFIG_PATH=/config/news_sources.json
      - OUT_DIR=/data/news_out
      - REFRESH_SECONDS=43200
      - SCHEDULE_TIMES=08:00,20:00
      - PORT=8080
      - QTWEBENGINE_DISABLE_SANDBOX=1
      - TZ=America/Chicago
    volumes:
      - ./data:/data
      - ./secrets:/secrets:ro
      - ./config:/config:ro
    restart: unless-stopped
